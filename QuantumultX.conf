#############################################
# Quantumult X 终极个人专属配置 
#############################################

# =====================================
# 通用设置 (general)
# =====================================
[general]
# 1. 连通性测试 (本地网络与代理节点双重检测)
network_check_url = http://www.apple.com/library/test/success.html
server_check_url = http://www.gstatic.com/generate_204
server_check_timeout = 2500

# 2. 首页头像与资源解析器
profile_img_url = https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/author/fmz200-01.png
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js

# 3. 节点地理位置展示脚本
geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/fmz200/wool_scripts/main/QuantumultX/scripts/server_location.js

# 4. Wi-Fi 自动切换模式 (连入软路由 Wi-Fi 时可取消注释防双重代理)
# running_mode_trigger = filter, filter, Asus-5G:all_direct

# 5. 本机回环反射路由 (SideStore 自签 / JIT 用，需要时去掉行首 # 号)
# reflected_routes = 10.7.0.1/32

# 6. 全量 Fake-IP 排除列表 (解决一键登录、银行风控、Wi-Fi 探针、NTP 时间同步等问题)
dns_exclusion_list = *.10099.com.cn, *.cmpassport.com, id6.me, open.e.189.cn, mdn.open.wo.cn, opencloud.wostore.cn, auth.wosms.cn, *.jegotrip.com.cn, *.icitymobile.mobi, *.pingan.com.cn, *.cmbchina.com, *.icbc.com.cn, *.lan, *.direct, *?miwifi.com, cable.auth.com, *.msftconnecttest.com, *.msftncsi.com, network-test.debian.org, detectportal.firefox.com, resolver1.opendns.com, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, stun.*, global.turn.twilio.com, global.stun.twilio.com, localhost.*.qq.com, localhost.*.weixin.qq.com, *.mcdn.bilivideo.cn, *.logon.battlenet.com.cn, *.logon.battle.net, *.blzstatic.cn, pool.ntp.org, *.pool.ntp.org, ntp.*.com, time.*.com, ntp?.*.com, time?.*.com, time.*.gov, time.*.edu.cn, *.ntp.org.cn, time.*.apple.com, PDC._msDCS.*.*, DC._msDCS.*.*, GC._msDCS.*.*

# 7. 局域网与运营商保留网段直连 (保障内网 NAS / 路由 / 盒子直通)
excluded_routes = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 239.255.255.250/32, 255.255.255.255/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32

# 8. 现代广告拦截空应答与 QUIC / STUN 协议阻断
dns_reject_domain_behavior = no-error-no-answer
udp_drop_list = 443, STUN, QUIC
fallback_udp_policy = direct
icmp_auto_reply = true


# =====================================
# DNS 配置 (dns)
# =====================================
[dns]
no-system
no-ipv6
prefer-doh3

# 1. 拦截运营商 DNS 劫持假 IP
circumvent-ipv4-answer = 127.0.0.1, 0.0.0.0, 61.160.148.90, 182.43.124.6, 124.236.16.201, 39.102.194.95, 106.74.25.198, 183.192.65.101, 36.135.17.248, 36.135.82.110, 39.105.1.17, 39.130.181.72, 39.130.181.73
circumvent-ipv6-answer = ::1, ::

# 2. 阿里与腾讯加密 DNS (DoH) 并发解析
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
server = 223.5.5.5
server = 119.29.29.29

# 3. App Store 官方下载 CDN 加速
alias = /iosapps.itunes.apple.com/iosapps.itunes.apple.com.download.ks-cdn.com

# 4. 国内常用站点就近 CDN 解析
