# =====================================
# 策略组 (policy)
# =====================================
[policy]
# 1. 可视化去广告开关 (遇误杀可临时点开切 DIRECT 放行)
static=广告拦截, reject, direct, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Adblock.png

# 2. 核心总控与兜底策略
static=兜底策略, proxy, 自动选择, 香港节点, 新加坡节点, 日本节点, 美国节点, 台湾节点, 韩国节点, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png

# 3. 国际应用策略 (人工智能默认优先走美国粘性防跳 IP 风控)
static=谷歌服务, proxy, 香港节点, 新加坡节点, 日本节点, 美国节点, 自动选择, direct, img-url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/Google.png
static=人工智能, 美国粘性, proxy, 新加坡节点, 美国节点, 日本节点, 台湾节点, 自动选择, direct, img-url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/ChatGPT3.png
static=海外抖音, proxy, 新加坡节点, 美国节点, 日本节点, 香港节点, 自动选择, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok_2.png
static=电报消息, proxy, 新加坡节点, 香港节点, 日本节点, 美国节点, 自动选择, direct, img-url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/Telegram_01.png
static=Spotify, proxy, 新加坡节点, 香港节点, 日本节点, 美国节点, 自动选择, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png

# 4. 苹果、微软与国内网盘影视 (逛外区 App Store 时可将苹果服务切香港/美国，下载 CDN 仍保持直连满速)
static=苹果服务, direct, proxy, 香港节点, 新加坡节点, 日本节点, 美国节点, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Apple.png
static=Microsoft, direct, proxy, 香港节点, 新加坡节点, 日本节点, 美国节点, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Microsoft.png
static=PanVod, direct, proxy, reject, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Cloud.png
static=ResourceSite, direct, proxy, reject, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TV.png
static=大陆抖音, direct, proxy, img-url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/Tiktok_06.png

# 5. AI 专属粘性节点组 (按目标域名哈希固定出口，防止对话中途跳 IP)
dest-hash=美国粘性, server-tag-regex=(?i)^(?=.*(?:美国|美國|洛杉矶|硅谷|圣何塞|西雅图|芝加哥|达拉斯|🇺🇸|\b(?:US|USA|United States|America)\b))(?!.*(?:香港|台湾|日本|新加坡|韩国|回国|游戏)).*$, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png

# 6. 全局与分地区自动测速组 (过滤无效信息节点，公差 50 防频繁切换)
url-latency-benchmark=自动选择, server-tag-regex=(?i)^(?!.*(?:流量|剩余|到期|过期|套餐|重置|官网|官方|群|客服|邀请|返利|过滤|防失联|节点|网址|订阅|距离|下次|版本|备用|已用|联系|邮箱|工单|网易|音乐|Netease|Music|Unblock|🎵|🎶|🎧|\d{4}-\d{2}-\d{2}|\dG)).*$, check-interval=600, tolerance=50, alive-checking=true, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
