url-latency-benchmark=新加坡节点, server-tag-regex=(?i)^(?=.*(?:新加坡|狮|獅|🇸🇬|\b(?:SG|SGP|Singapore)\b))(?!.*(?:香港|台湾|日本|美国|韩国|回国|游戏)).*$, check-interval=600, tolerance=50, alive-checking=true, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png
url-latency-benchmark=日本节点, server-tag-regex=(?i)^(?=.*(?:日本|川日|东京|大阪|泉日|埼玉|🇯🇵|\b(?:JP|JPN|Japan)\b))(?!.*(?:香港|台湾|新加坡|美国|韩国|回国|游戏)).*$, check-interval=600, tolerance=50, alive-checking=true, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png
url-latency-benchmark=美国节点, server-tag-regex=(?i)^(?=.*(?:美国|美國|洛杉矶|硅谷|圣何塞|西雅图|芝加哥|达拉斯|🇺🇸|\b(?:US|USA|United States|America)\b))(?!.*(?:香港|台湾|日本|新加坡|韩国|回国|游戏)).*$, check-interval=600, tolerance=50, alive-checking=true, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png
url-latency-benchmark=台湾节点, server-tag-regex=(?i)^(?=.*(?:台湾|台灣|台北|🇹🇼|\b(?:TW|TWN|Taiwan)\b))(?!.*(?:香港|日本|新加坡|美国|韩国|回国|游戏)).*$, check-interval=600, tolerance=50, alive-checking=true, img-url=https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/icon/color/tw.png
url-latency-benchmark=韩国节点, server-tag-regex=(?i)^(?=.*(?:韩国|韓國|首尔|🇰🇷|\b(?:KR|KOR|Korea)\b))(?!.*(?:香港|台湾|日本|新加坡|美国|回国|游戏)).*$, check-interval=600, tolerance=50, alive-checking=true, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/KR.png


